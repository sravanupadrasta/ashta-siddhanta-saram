<ion-tabs *ngIf="(visibleTabs$ | async) as tabs">
  <ion-tab-bar slot="bottom">
    <ion-tab-button *ngFor="let tab of tabs" [tab]="tab.route" [routerLink]="['/tabs', tab.route]">
      <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
      <ion-label>{{ tab.label }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
